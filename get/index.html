<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get Olympus Siege</title>
<meta name="description" content="Download Olympus Siege — idle Greek mythology tower defense — free on Google Play and the App Store.">
<link rel="icon" type="image/png" href="../assets/icon-180.png?v=2">
<link rel="apple-touch-icon" href="../assets/icon-180.png?v=2">
<script>
/* Ad landing page: forward straight to the right store. The ad's URL stays on this site
   (Meta's Traffic objective refuses store links), and this page does the routing.
   ?src=<tag> is carried into Play's install referrer (utm_source) so installs can be attributed. */
(function () {
  var q = new URLSearchParams(location.search);
  var src = (q.get('src') || 'site').replace(/[^a-z0-9_-]/gi, '').slice(0, 24) || 'site';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.olympussiege.app&referrer=' +
             encodeURIComponent('utm_source=' + src + '&utm_medium=ad&utm_campaign=get');
  var IOS  = 'https://apps.apple.com/app/id6800301945';
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  window.__OS_LINKS = { PLAY: PLAY, IOS: IOS };
  if (isIOS) location.replace(IOS);
  else if (isAndroid) location.replace(PLAY);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css?v=3">
<style>
  html, body { background: #060a12; }
  .get { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 20px; }
  .get .mark { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 0 40px rgba(232,196,106,.25); }
  .get .title { margin-top: 22px; }
  .get .lede { max-width: 420px; }
  .get .badges { justify-content: center; margin-top: 22px; }
  .get .fine { margin-top: 26px; font-size: 12px; color: rgba(243,234,212,.5); }
</style>
</head>
<body>
<main class="get">
  <img class="mark" src="../assets/icon-512.png?v=2" alt="Olympus Siege">
  <div class="kicker">Defend the Divine Throne</div>
  <h1 class="title">OLYMPUS SIEGE</h1>
  <p class="lede">Idle Greek mythology tower defense. Twelve gods, endless waves, one throne — and the gods keep fighting while you're away. Free.</p>
  <div class="badges">
    <a class="badge" id="play" style="text-decoration:none;color:inherit" href="https://play.google.com/store/apps/details?id=com.olympussiege.app"><small>Get it on</small><b>GOOGLE PLAY</b></a>
    <a class="badge" id="ios"  style="text-decoration:none;color:inherit" href="https://apps.apple.com/app/id6800301945"><small>Download on the</small><b>APP STORE</b></a>
  </div>
  <div class="fine">Taking you to your store… if nothing happens, tap a badge above.</div>
</main>
<script>
  /* keep the visible badges in step with the routed links (carries the referrer tag) */
  try { document.getElementById('play').href = window.__OS_LINKS.PLAY; document.getElementById('ios').href = window.__OS_LINKS.IOS; } catch (e) {}
</script>
</body>
</html>
